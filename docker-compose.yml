networks:
  nullchats_network:
    driver: bridge

volumes:
  nullchats_mysql_data:

services:
  # =========================================================================
  # 1. Base de Datos MySQL
  # =========================================================================
  mysql:
    image: mysql:8.0
    container_name: nullchats-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "nullchats*12*"
      MYSQL_DATABASE: "nullchats"
      TZ: "America/Montevideo"
    volumes:
      - nullchats_mysql_data:/var/lib/mysql
      # Inicialización automática: Docker ejecutará el SQL la primera vez que se cree
      - ./DB-SQL.txt:/docker-entrypoint-initdb.d/init.sql
    networks:
      - nullchats_network

  # =========================================================================
  # 2. Servidor de Aplicaciones (Tomcat)
  # =========================================================================
  tomcat:
    image: tomcat:10.1-jdk17
    container_name: nullchats-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      # Pasamos las variables al context.xml para que apunte al contenedor MySQL
      - JAVA_OPTS=-DDB_HOST=mysql -DDB_PORT=3306 -Xmx4g
      - TZ=America/Montevideo
    volumes:
      # Mapeamos el .war compilado.
      # Al llamarlo ROOT.war forzamos a que se ejecute en la ruta raíz (/)
      - ./target/voidchats.war:/usr/local/tomcat/webapps/ROOT.war
      - ./data:/var/nullchats/data
    networks:
      - nullchats_network
    depends_on:
      - mysql

  # =========================================================================
  # 3. API Local de Avatares (Microservicio DiceBear)
  # =========================================================================
  dicebear:
    image: dicebear/api:latest
    container_name: nullchats-dicebear
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - nullchats_network